name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: muscles_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d muscles_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MUSCLES_SQL_TEST_POSTGRES: postgresql://test:test@localhost:5432/muscles_test
      MUSCLES_SQL_MIGRATIONS_TEST_URL: postgresql://test:test@localhost:5432/muscles_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install --pre "muscles>=1.0.0rc1,<2.0.0"
      - run: python -m pip install -e ".[dev,postgres]"
      - run: PYTHONPATH=src python -m pytest -q
      - run: python -m build --wheel --sdist
